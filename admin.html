<!-- =========================
     Admin.html — SIMPLE (Rouge vs Jaune)
     - Chaque tour = 2 matchs : Rouge 1 vs Jaune 1, Rouge 2 vs Jaune 2
     - Saisie scores + Validation
     - À la validation : calcul des points (3/1, 2/2) + génération automatique du tour suivant
     - Classement cumulé Rouge vs Jaune (points)
     ========================= -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Rouge vs Jaune</title>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --panel2:#f8fafc;
      --text:#111827;
      --muted:#6b7280;
      --border:rgba(0,0,0,.10);
      --shadow: 0 10px 26px rgba(0,0,0,.10);

      --green:#16a34a;
      --green2:#15803d;

      --red:#ef4444;
      --red2:#b91c1c;

      --yellow:#facc15;
      --yellow2:#ca8a04;

      --ok:#16a34a;
      --warn:#f59e0b;
      --bad:#ef4444;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header{
      background: linear-gradient(90deg, var(--green), var(--green2));
      padding: 12px 14px;
      box-shadow: var(--shadow);
      position: sticky;
      top:0;
      z-index: 50;
      color:#fff;
    }
    .headRow{
      max-width: 1100px;
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .titleWrap{ line-height:1.12; }
    .t1{ font-weight:1000; font-size:16px; }
    .t2{ font-weight:800; font-size:12px; opacity:.95; }

    .statusPill{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.18);
      font-size:12px;
      white-space:nowrap;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(245,158,11,.18);
    }
    .dot.ok{ background: var(--ok); box-shadow: 0 0 0 4px rgba(22,163,74,.18); }
    .dot.bad{ background: var(--bad); box-shadow: 0 0 0 4px rgba(239,68,68,.18); }

    .container{
      max-width: 1100px;
      margin: 14px auto 40px;
      padding: 0 12px;
    }

    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      align-items:start;
    }
    @media (max-width: 920px){
      .grid{ grid-template-columns: 1fr; }
    }

    .panel{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 12px;
    }

    .panelTitle{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .panelTitle h2{
      margin:0;
      font-size: 15px;
      font-weight: 1000;
      letter-spacing:.2px;
    }
    .hint{ color: var(--muted); font-size: 12px; text-align:right; }

    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      border: 1px solid rgba(0,0,0,.10);
      background: #f3f4f6;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 1000;
      font-size: 13px;
      transition:.15s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(22,163,74,.98), rgba(21,128,61,.98));
      border-color: rgba(255,255,255,.20);
      color: #fff;
    }
    .btn.danger{
      background: rgba(239,68,68,.12);
      border-color: rgba(239,68,68,.25);
      color: #7f1d1d;
    }
    .btn.secondary{
      background: rgba(0,0,0,.04);
      color: var(--text);
    }

    .divider{ height:1px; background: rgba(0,0,0,.06); margin: 10px 0; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.10);
      background: #f3f4f6;
      font-size: 12px;
      font-weight: 1000;
      color: var(--text);
      white-space:nowrap;
    }
    .badge.red{ background: rgba(239,68,68,.14); border-color: rgba(239,68,68,.28); }
    .badge.yellow{ background: rgba(250,204,21,.18); border-color: rgba(250,204,21,.35); }
    .badge.ok{ background: rgba(22,163,74,.14); border-color: rgba(22,163,74,.28); }
    .badge.neutral{ background: rgba(0,0,0,.04); }

    .matchCard{
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 16px;
      background:#fff;
      box-shadow: var(--shadow);
      padding: 12px;
      margin-top: 10px;
    }
    .matchHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .matchTitle{ font-weight:1000; font-size: 14px; }
    .matchMeta{ color: var(--muted); font-size: 12px; font-weight:900; text-align:right; }

    .scoreRow{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 8px;
    }
    .scoreRow input{
      width: 92px;
      text-align:center;
      font-weight: 1000;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.15);
      outline:none;
      font-size: 14px;
    }
    .mini{ font-size: 12px; color: var(--muted); font-weight: 800; }

    table{
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      overflow:hidden;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.10);
      background: #fff;
    }
    th, td{
      padding: 8px 8px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      text-align:left;
      vertical-align: top;
    }
    th{
      color: #111827;
      background: #f3f4f6;
      font-weight: 1000;
    }
    .right{ text-align:right; }

    .log{
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: rgba(229,231,235,.92);
      max-height: 320px;
      overflow:auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
<header>
  <div class="headRow">
    <div class="titleWrap">
      <div class="t1">Admin — Rouge vs Jaune</div>
      <div class="t2">2 matchs par tour • points 3/1 • 2/2 si égalité</div>
    </div>

    <div class="statusPill" title="Statut Firestore">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connexion…</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="grid">
    <!-- LEFT -->
    <div class="panel">
      <div class="panelTitle">
        <h2>Tour en cours</h2>
        <span class="hint" id="curHint">—</span>
      </div>

      <div class="row">
        <button class="btn danger" id="btnNew">⚠️ Nouveau tournoi</button>
        <button class="btn secondary" id="btnForceNext" title="Optionnel : génère un tour suivant sans valider (debug)">Générer tour suivant (debug)</button>
      </div>

      <div class="divider"></div>

      <div id="currentWrap">
        <div class="mini">Chargement…</div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="panel">
      <div class="panelTitle">
        <h2>Classement cumulé</h2>
        <span class="hint">sur tours validés</span>
      </div>

      <div id="scoreBox" style="margin-bottom:10px;">
        <div class="mini">Chargement…</div>
      </div>

      <div class="divider"></div>

      <div class="panelTitle">
        <h2>Historique</h2>
        <span class="hint">tous les tours</span>
      </div>
      <div id="historyWrap" class="mini">Chargement…</div>

      <div class="divider"></div>

      <div class="panelTitle">
        <h2>Journal</h2>
        <span class="hint">utile si ça bloque</span>
      </div>
      <div class="log" id="logBox"></div>
    </div>
  </div>
</div>

<script type="module">
  // ================================
  // Firebase (Firestore)
  // ================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    updateDoc,
    onSnapshot,
    query,
    orderBy,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7-WLKEmajFSh4INdTCVpPvF2hv_jPQm8",
    authDomain: "americano-lisa-manon.firebaseapp.com",
    projectId: "americano-lisa-manon",
    storageBucket: "americano-lisa-manon.firebasestorage.app",
    messagingSenderId: "98885291802",
    appId: "1:98885291802:web:6aff774b8f8df14db226a3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ================================
  // UI
  // ================================
  const statusDot  = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const logBox     = document.getElementById("logBox");
  const curHint    = document.getElementById("curHint");
  const currentWrap = document.getElementById("currentWrap");
  const scoreBox    = document.getElementById("scoreBox");
  const historyWrap = document.getElementById("historyWrap");

  function setStatus(state, text){
    statusText.textContent = text || "";
    statusDot.classList.remove("ok","bad");
    if(state==="ok") statusDot.classList.add("ok");
    if(state==="bad") statusDot.classList.add("bad");
  }
  function log(msg, kind="ok"){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const ss = String(now.getSeconds()).padStart(2,"0");
    const icon = kind==="ok" ? "✅" : (kind==="warn" ? "⚠️" : "❌");
    logBox.textContent = `[${hh}:${mm}:${ss}] ${icon} ${msg}\n` + logBox.textContent;
  }

  // ================================
  // Data model (ultra simple)
  // Collection: rounds
  // doc:
  // {
  //   roundNumber: 1,
  //   validated: false,
  //   matches: [
  //     { idx: 1, scoreR: null, scoreJ: null, ptsR: 0, ptsJ: 0 },
  //     { idx: 2, scoreR: null, scoreJ: null, ptsR: 0, ptsJ: 0 }
  //   ],
  //   createdAt: Date.now()
  // }
  // ================================
  const roundsCol = collection(db, "rounds");
  let roundsCache = []; // ordered by roundNumber asc

  function pointsFromScores(scoreR, scoreJ){
    // win: 3/1, draw 2/2
    if(scoreR > scoreJ) return { ptsR: 3, ptsJ: 1 };
    if(scoreJ > scoreR) return { ptsR: 1, ptsJ: 3 };
    return { ptsR: 2, ptsJ: 2 };
  }

  function computeTotalsFromValidated(){
    let totalR = 0;
    let totalJ = 0;
    let tours = 0;

    roundsCache.forEach(r=>{
      if(r.validated !== true) return;
      tours += 1;
      (r.matches || []).slice(0,2).forEach(m=>{
        totalR += Number(m.ptsR || 0);
        totalJ += Number(m.ptsJ || 0);
      });
    });

    return { totalR, totalJ, tours };
  }

  function getCurrentRound(){
    // current = first non validated; if none and at least 1 exists => null
    return roundsCache.find(r=>r.validated !== true) || null;
  }

  async function createRound(roundNumber){
    const payload = {
      roundNumber,
      validated: false,
      matches: [
        { idx: 1, scoreR: null, scoreJ: null, ptsR: 0, ptsJ: 0 },
        { idx: 2, scoreR: null, scoreJ: null, ptsR: 0, ptsJ: 0 },
      ],
      createdAt: Date.now()
    };
    await addDoc(roundsCol, payload);
    log(`Tour ${roundNumber} créé.`);
  }

  async function ensureTournamentInitialized(){
    if(roundsCache.length) return;
    await createRound(1);
  }

  function renderScoreboard(){
    const { totalR, totalJ, tours } = computeTotalsFromValidated();
    const lead = totalR === totalJ ? "Égalité" : (totalR > totalJ ? "Rouge devant" : "Jaune devant");

    scoreBox.innerHTML = `
      <div class="matchCard" style="margin-top:0;">
        <div class="matchHead">
          <div class="matchTitle">Total points</div>
          <div class="matchMeta">${tours} tour(s) validé(s)</div>
        </div>

        <div class="row" style="justify-content:space-between;">
          <span class="badge red">🔴 Rouge</span>
          <span class="badge red" style="font-size:14px;">${totalR}</span>
        </div>

        <div class="divider"></div>

        <div class="row" style="justify-content:space-between;">
          <span class="badge yellow">🟡 Jaune</span>
          <span class="badge yellow" style="font-size:14px;">${totalJ}</span>
        </div>

        <div class="divider"></div>

        <div class="row" style="justify-content:space-between;">
          <span class="badge neutral">Statut</span>
          <span class="badge ok">${lead}</span>
        </div>

        <div class="mini" style="margin-top:8px;">
          Rappel points (par match) : victoire = 3 / 1 • égalité = 2 / 2
        </div>
      </div>
    `;
  }

  function renderHistory(){
    if(!roundsCache.length){
      historyWrap.innerHTML = `<div class="mini">Aucun tour.</div>`;
      return;
    }

    const rows = [...roundsCache].slice().reverse().map(r=>{
      const m1 = (r.matches||[])[0] || {};
      const m2 = (r.matches||[])[1] || {};
      const st = r.validated ? "✅ Validé" : "⏳ En cours";
      const s1 = (typeof m1.scoreR === "number" && typeof m1.scoreJ === "number") ? `${m1.scoreR}-${m1.scoreJ}` : "—";
      const s2 = (typeof m2.scoreR === "number" && typeof m2.scoreJ === "number") ? `${m2.scoreR}-${m2.scoreJ}` : "—";

      return `
        <tr>
          <td><b>Tour ${r.roundNumber}</b></td>
          <td>${st}</td>
          <td class="right">${s1}</td>
          <td class="right">${s2}</td>
        </tr>
      `;
    }).join("");

    historyWrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Tour</th><th>Statut</th>
            <th class="right">Match 1</th>
            <th class="right">Match 2</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function renderCurrent(){
    const cur = getCurrentRound();

    if(!cur){
      curHint.textContent = "—";
      currentWrap.innerHTML = `
        <div class="mini">Aucun tour en cours (tout est validé).</div>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary" id="btnCreateNext">Créer un nouveau tour</button>
        </div>
      `;

      const btn = document.getElementById("btnCreateNext");
      btn?.addEventListener("click", async ()=>{
        const max = roundsCache.length ? Math.max(...roundsCache.map(r=>Number(r.roundNumber||0))) : 0;
        await createRound(max+1);
      });
      return;
    }

    curHint.textContent = `Tour ${cur.roundNumber}`;

    const m1 = (cur.matches||[])[0] || { idx:1, scoreR:null, scoreJ:null };
    const m2 = (cur.matches||[])[1] || { idx:2, scoreR:null, scoreJ:null };

    currentWrap.innerHTML = `
      <div class="matchCard">
        <div class="matchHead">
          <div class="matchTitle">Match 1</div>
          <div class="matchMeta">🔴 Rouge 1 vs 🟡 Jaune 1</div>
        </div>

        <div class="row">
          <span class="badge red">🔴 Rouge 1</span>
          <span class="badge yellow">🟡 Jaune 1</span>
        </div>

        <div class="scoreRow">
          <input id="m1r" type="number" min="0" placeholder="Score Rouge" value="${(typeof m1.scoreR==="number")?m1.scoreR:""}">
          <input id="m1j" type="number" min="0" placeholder="Score Jaune" value="${(typeof m1.scoreJ==="number")?m1.scoreJ:""}">
          <span class="mini">Ex: 4 - 2</span>
        </div>
      </div>

      <div class="matchCard">
        <div class="matchHead">
          <div class="matchTitle">Match 2</div>
          <div class="matchMeta">🔴 Rouge 2 vs 🟡 Jaune 2</div>
        </div>

        <div class="row">
          <span class="badge red">🔴 Rouge 2</span>
          <span class="badge yellow">🟡 Jaune 2</span>
        </div>

        <div class="scoreRow">
          <input id="m2r" type="number" min="0" placeholder="Score Rouge" value="${(typeof m2.scoreR==="number")?m2.scoreR:""}">
          <input id="m2j" type="number" min="0" placeholder="Score Jaune" value="${(typeof m2.scoreJ==="number")?m2.scoreJ:""}">
          <span class="mini">Ex: 3 - 3</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="row" style="justify-content:flex-end;">
        <button class="btn primary" id="btnSave">Enregistrer</button>
        <button class="btn primary" id="btnValidate">Valider le tour & générer le suivant</button>
      </div>

      <div class="mini" style="margin-top:8px;">
        “Enregistrer” sauvegarde les scores sans valider. “Valider” calcule les points + crée le tour suivant.
      </div>
    `;

    const curId = cur.id;

    function readScores(){
      const a1 = document.getElementById("m1r").value;
      const b1 = document.getElementById("m1j").value;
      const a2 = document.getElementById("m2r").value;
      const b2 = document.getElementById("m2j").value;

      const s = {
        m1r: a1==="" ? null : Number(a1),
        m1j: b1==="" ? null : Number(b1),
        m2r: a2==="" ? null : Number(a2),
        m2j: b2==="" ? null : Number(b2),
      };

      // basic validation
      for(const k of Object.keys(s)){
        if(s[k] === null) continue;
        if(Number.isNaN(s[k]) || s[k] < 0) return { ok:false, msg:"Saisis des scores valides (>=0)." };
      }
      return { ok:true, s };
    }

    async function saveScoresOnly(){
      const { ok, msg, s } = readScores();
      if(!ok){ alert(msg); return; }

      const matches = [
        { idx: 1, scoreR: s.m1r, scoreJ: s.m1j, ptsR: 0, ptsJ: 0 },
        { idx: 2, scoreR: s.m2r, scoreJ: s.m2j, ptsR: 0, ptsJ: 0 },
      ];
      await updateDoc(doc(db,"rounds",curId), { matches });
      log(`Scores enregistrés (Tour ${cur.roundNumber}).`);
    }

    async function validateAndGenerateNext(){
      const { ok, msg, s } = readScores();
      if(!ok){ alert(msg); return; }

      // require all 4 scores to validate
      if([s.m1r,s.m1j,s.m2r,s.m2j].some(v => typeof v !== "number")){
        alert("Pour valider, il faut saisir les 4 scores (2 matchs).");
        return;
      }

      const p1 = pointsFromScores(s.m1r, s.m1j);
      const p2 = pointsFromScores(s.m2r, s.m2j);

      const matches = [
        { idx: 1, scoreR: s.m1r, scoreJ: s.m1j, ptsR: p1.ptsR, ptsJ: p1.ptsJ },
        { idx: 2, scoreR: s.m2r, scoreJ: s.m2j, ptsR: p2.ptsR, ptsJ: p2.ptsJ },
      ];

      // validate current
      await updateDoc(doc(db,"rounds",curId), {
        matches,
        validated: true,
        validatedAt: Date.now()
      });

      log(`Tour ${cur.roundNumber} validé : points Rouge +${p1.ptsR + p2.ptsR}, Jaune +${p1.ptsJ + p2.ptsJ}.`, "ok");

      // generate next
      const nextRound = Number(cur.roundNumber || 0) + 1;
      await createRound(nextRound);
    }

    document.getElementById("btnSave").addEventListener("click", async ()=>{
      try{
        await saveScoresOnly();
      }catch(e){
        console.error(e);
        log(`Erreur enregistrement: ${e?.message || e}`, "bad");
        alert("Erreur Firestore lors de l'enregistrement.");
      }
    });

    document.getElementById("btnValidate").addEventListener("click", async ()=>{
      if(!confirm("Valider ce tour ? (Calcul points + génération du tour suivant)")) return;
      try{
        await validateAndGenerateNext();
      }catch(e){
        console.error(e);
        log(`Erreur validation: ${e?.message || e}`, "bad");
        alert("Erreur Firestore lors de la validation.");
      }
    });
  }

  // ================================
  // Actions
  // ================================
  document.getElementById("btnNew").addEventListener("click", async ()=>{
    if(!confirm("⚠️ Nouveau tournoi : supprimer TOUS les tours puis recréer Tour 1. Continuer ?")) return;
    try{
      const snap = await getDocs(query(roundsCol));
      for(const d of snap.docs){
        await deleteDoc(doc(db,"rounds",d.id));
      }
      log("Tous les tours supprimés (nouveau tournoi).", "warn");
      await createRound(1);
    }catch(e){
      console.error(e);
      log(`Erreur nouveau tournoi: ${e?.message || e}`, "bad");
      alert("Erreur Firestore lors du nouveau tournoi.");
    }
  });

  document.getElementById("btnForceNext").addEventListener("click", async ()=>{
    const max = roundsCache.length ? Math.max(...roundsCache.map(r=>Number(r.roundNumber||0))) : 0;
    if(!confirm(`Générer Tour ${max+1} (debug) ?`)) return;
    try{
      await createRound(max+1);
    }catch(e){
      console.error(e);
      log(`Erreur génération: ${e?.message || e}`, "bad");
      alert("Erreur Firestore lors de la génération.");
    }
  });

  // ================================
  // Live listener
  // ================================
  setStatus("warn","Connexion…");

  onSnapshot(query(roundsCol, orderBy("roundNumber","asc")), async (snap)=>{
    roundsCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));

    try{
      // init if empty
      if(!roundsCache.length){
        await createRound(1);
        // snapshot will re-fire
      }
    }catch(e){
      console.error(e);
      log(`Init rounds erreur: ${e?.message || e}`, "bad");
    }

    renderScoreboard();
    renderHistory();
    renderCurrent();

    setStatus("ok","Connecté");
  }, (err)=>{
    console.error(err);
    setStatus("bad","Erreur Firestore");
    log(`onSnapshot rounds: ${err?.message || err}`, "bad");
    currentWrap.innerHTML = `<div class="mini">Erreur Firestore. Vérifie les Rules (permissions).</div>`;
  });
