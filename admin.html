<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Americano Lisa vs Manon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      margin:0;
      background:#0f172a;
      color:#e5e7eb;
    }
    header{
      background:#b91c1c;
      padding:14px;
      font-weight:700;
    }
    header small{
      display:block;
      font-weight:400;
      opacity:.9;
    }
    .container{
      max-width:1100px;
      margin:auto;
      padding:14px;
      display:grid;
      gap:14px;
    }
    .box{
      background:#020617;
      border-radius:10px;
      padding:12px;
      border:1px solid #1e293b;
    }
    h2{
      margin:0 0 10px 0;
      font-size:16px;
    }
    input,select,button{
      padding:8px;
      border-radius:6px;
      border:none;
      font-size:14px;
    }
    input,select{
      background:#020617;
      color:#e5e7eb;
      border:1px solid #334155;
    }
    button{
      cursor:pointer;
      font-weight:600;
    }
    .btn-red{ background:#dc2626; color:white; }
    .btn-yellow{ background:#facc15; color:#020617; }
    .btn-gray{ background:#334155; color:white; }

    .row{ display:flex; gap:8px; flex-wrap:wrap; }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      font-size:13px;
      cursor:pointer;
    }
    .lisa{ background:#ec4899; color:white; }
    .manon{ background:#8b5cf6; color:white; }
    .neutral{ background:#334155; }

    .lists{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    ul{ list-style:none; padding:0; margin:0; }
    li{ margin-bottom:6px; }

    .log{
      font-family:monospace;
      font-size:12px;
      background:#020617;
      padding:8px;
      border-radius:6px;
      max-height:160px;
      overflow:auto;
    }
  </style>
</head>
<body>

<header>
  Admin – Attribution Teams (Lisa / Manon)
  <small>Americano Lisa vs Manon</small>
</header>

<div class="container">

  <!-- 1. AJOUT JOUEUR -->
  <div class="box">
    <h2>1) Ajout de joueurs (sans équipe)</h2>
    <div class="row">
      <input id="playerName" placeholder="Nom / Prénom" />
      <select id="playerGender">
        <option value="">Sexe (optionnel)</option>
        <option value="F">Femme</option>
        <option value="H">Homme</option>
      </select>
      <button class="btn-red" onclick="addPlayer()">Ajouter le joueur</button>
    </div>
  </div>

  <!-- 2. DRAFT -->
  <div class="box">
    <h2>2) Réglage du draft</h2>
    <div class="row">
      <strong>Au tour de :</strong> <span id="turnLabel">—</span>
    </div>
    <div class="row" style="margin-top:6px;">
      <select id="starterSelect">
        <option value="">Qui commence ?</option>
        <option value="Lisa">Lisa</option>
        <option value="Manon">Manon</option>
      </select>
      <button class="btn-yellow" onclick="setStarter()">Définir “qui commence”</button>
      <button class="btn-gray" onclick="resetDraft()">Réinitialiser</button>
    </div>
  </div>

  <!-- 3. LISTES -->
  <div class="box">
    <h2>3) Listes</h2>
    <div class="lists">
      <div>
        <strong>Sans équipe</strong>
        <ul id="listNone"></ul>
      </div>
      <div>
        <strong>Team Lisa</strong>
        <ul id="listLisa"></ul>
      </div>
      <div>
        <strong>Team Manon</strong>
        <ul id="listManon"></ul>
      </div>
    </div>
  </div>

  <!-- 4. LOG -->
  <div class="box">
    <h2>Journal</h2>
    <div id="log" class="log"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, doc,
    onSnapshot, setDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7-WLKemajFSh4INdTCVpPvF2hv_jPQm8",
    authDomain: "americano-lisa-manon.firebaseapp.com",
    projectId: "americano-lisa-manon",
    storageBucket: "americano-lisa-manon.firebasestorage.app",
    messagingSenderId: "98885291802",
    appId: "1:98885291802:web:6aff774bfb8fd14db226a3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const playersCol = collection(db, "players");
  const draftRef = doc(db, "meta", "draft");

  const log = msg => {
    const d = new Date().toLocaleTimeString();
    document.getElementById("log").innerHTML =
      `[${d}] ${msg}<br>` + document.getElementById("log").innerHTML;
  };

  async function addPlayer(){
    const name = playerName.value.trim();
    if(!name) return;
    await addDoc(playersCol,{
      name,
      gender: playerGender.value || null,
      team: null,
      createdAt: Date.now()
    });
    playerName.value="";
    log(`Joueur ajouté : ${name}`);
  }

  async function setStarter(){
    const who = starterSelect.value;
    if(!who) return;
    await setDoc(draftRef,{
      starter: who,
      turn: who
    });
    log(`Draft initialisé – ${who} commence`);
  }

  async function resetDraft(){
    await setDoc(draftRef,{});
    log("Draft réinitialisé");
  }

  async function pick(playerId, team){
    const snap = await getDoc(draftRef);
    if(!snap.exists()) return;
    const { turn } = snap.data();
    if(turn !== team) return;

    await updateDoc(doc(db,"players",playerId),{ team });
    await updateDoc(draftRef,{ turn: team === "Lisa" ? "Manon" : "Lisa" });
    log(`${team} choisit un joueur`);
  }

  onSnapshot(playersCol, snap=>{
    listNone.innerHTML="";
    listLisa.innerHTML="";
    listManon.innerHTML="";

    snap.docs.forEach(d=>{
      const p=d.data();
      const li=document.createElement("li");

      if(!p.team){
        li.innerHTML=`<span class="pill neutral">${p.name}</span>`;
        li.onclick=()=>pick(d.id,document.getElementById("turnLabel").textContent);
        listNone.appendChild(li);
      }
      if(p.team==="Lisa"){
        li.innerHTML=`<span class="pill lisa">${p.name}</span>`;
        listLisa.appendChild(li);
      }
      if(p.team==="Manon"){
        li.innerHTML=`<span class="pill manon">${p.name}</span>`;
        listManon.appendChild(li);
      }
    });
  });

  onSnapshot(draftRef,snap=>{
    document.getElementById("turnLabel").textContent =
      snap.exists() ? snap.data().turn || "—" : "—";
  });

</script>

</body>
</html>
