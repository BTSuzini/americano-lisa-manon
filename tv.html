<!-- =========================
     TV.html (vue TV) — v3 FIX
     - Layout FIXE sans scroll (100vh, overflow hidden)
     - 3 bandeaux en haut
     - Layout 2/3 gauche : Tour en cours / Tour à venir
     - Layout 1/3 droite : Classement équipes + Classement général (✅ à droite)
     - Sur chaque tour : Terrain 1 et 2 côte à côte (✅)
     - AUCUN scroll (✅)
     ========================= -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Americano Lisa vs Manon – TV</title>

  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f172a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:rgba(255,255,255,.10);
      --shadow: 0 16px 40px rgba(0,0,0,.45);

      --green:#16a34a;
      --green2:#15803d;

      --lisa:#b91c1c;
      --lisa2:#7f1d1d;

      --manon:#facc15;
      --manon2:#ca8a04;

      --ok:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
    }

    *{ box-sizing:border-box; }
    html, body{
      height:100%;
      margin:0;
      overflow:hidden; /* ✅ aucun scroll */
    }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1100px 700px at 15% 10%, rgba(34,197,94,.18), transparent 55%),
                  radial-gradient(1000px 650px at 85% 15%, rgba(250,204,21,.14), transparent 55%),
                  radial-gradient(900px 600px at 50% 100%, rgba(239,68,68,.14), transparent 60%),
                  var(--bg);
      color: var(--text);
    }

    /* ===== Page layout: topBars + main (no scroll) ===== */
    .page{
      height:100vh;            /* ✅ fixe */
      display:flex;
      flex-direction:column;
      overflow:hidden;         /* ✅ */
    }

    /* ====== 3 bandeaux ====== */
    .topBars{
      flex: 0 0 auto;
      z-index: 50;
      box-shadow: var(--shadow);
    }

    /* Vert (Admin) */
    .barAdmin{
      background: linear-gradient(90deg, rgba(22,163,74,1), rgba(21,128,61,1));
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .adminRow{
      max-width: 1800px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: 180px 1fr 180px;
      align-items:center;
      gap:14px;
    }
    .brandImg{
      height: 58px;
      width:auto;
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.28));
    }
    .adminCenter{
      text-align:center;
      line-height:1.12;
      color:#fff;
    }
    .t1{ font-weight:1000; font-size: 26px; letter-spacing:.2px; }
    .t2{ font-weight:900; font-size: 18px; opacity:.95; }

    .rightPack{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:14px;
    }
    .statusDotOnly{
      width:14px; height:14px; border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 0 6px rgba(245,158,11,.18);
      border: 1px solid rgba(255,255,255,.35);
    }
    .statusDotOnly.ok{ background: var(--ok); box-shadow: 0 0 0 6px rgba(34,197,94,.18); }
    .statusDotOnly.bad{ background: var(--bad); box-shadow: 0 0 0 6px rgba(239,68,68,.18); }

    /* Rouge Lisa */
    .barLisa{
      background: linear-gradient(90deg, rgba(185,28,28,1), rgba(127,29,29,1));
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      color:#fff;
      font-weight:1000;
      font-size: 22px;
      letter-spacing:.2px;
      text-align:center;
    }

    /* Jaune Manon */
    .barManon{
      background: linear-gradient(90deg, rgba(250,204,21,1), rgba(202,138,4,1));
      padding: 10px 18px;
      border-bottom: 1px solid rgba(0,0,0,.15);
      color:#111827;
      font-weight:1000;
      font-size: 22px;
      letter-spacing:.2px;
      text-align:center;
    }

    /* ===== Main ===== */
    main{
      flex: 1 1 auto;          /* prend tout le reste */
      overflow:hidden;         /* ✅ aucun scroll */
      display:flex;
      justify-content:center;
      align-items:stretch;
      padding: 14px 18px 16px;
    }

    .wrap{
      width:100%;
      max-width: 1800px;
      overflow:hidden;         /* ✅ */
      display:flex;
    }

    .grid{
      width:100%;
      display:grid;
      grid-template-columns: 2fr 1fr; /* ✅ 2/3 - 1/3 */
      gap: 16px;
      align-items: stretch;
      overflow:hidden;         /* ✅ */
      min-height:0;
    }

    .col{
      display:flex;
      flex-direction:column;
      gap:16px;
      overflow:hidden;         /* ✅ */
      min-height:0;
    }

    /* chaque colonne se répartit en 2 cartes hauteur égale */
    .col.left .card{ flex:1 1 0; min-height:0; }
    .col.right .card{ flex:1 1 0; min-height:0; }

    .card{
      background: linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.90));
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px 14px 14px;
      overflow:hidden;         /* ✅ */
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .cardHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
      flex: 0 0 auto;
    }
    .cardTitle{
      font-weight:1000;
      font-size: 18px;
      letter-spacing:.2px;
    }
    .cardMeta{
      font-weight:900;
      font-size: 14px;
      color: var(--muted);
      text-align:right;
      white-space:nowrap;
    }

    .miniInfo{
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    /* zone contenu dans les cartes = jamais de scroll, doit "tenir" */
    .cardBody{
      flex: 1 1 auto;
      min-height:0;
      overflow:hidden; /* ✅ pas de scroll interne */
    }

    /* ✅ Terrains côte à côte (toujours, TV) */
    .courtsGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .courtBlock{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      padding: 12px;
      overflow:hidden;
    }
    .courtTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 8px;
    }
    .courtName{
      font-weight:1000;
      font-size: 14px;
      color: rgba(229,231,235,.96);
    }
    .courtState{
      font-weight:900;
      font-size: 13px;
      color: var(--muted);
      white-space:nowrap;
    }

    .teamLine{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      margin-top: 8px;
      overflow:hidden;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 11px;
      border-radius: 999px;
      font-weight:1000;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,.12);
      white-space:nowrap;
      flex: 0 0 auto;
    }
    .badge.lisa{ background: rgba(239,68,68,.18); }
    .badge.manon{ background: rgba(250,204,21,.18); color:#111827; border-color: rgba(0,0,0,.12); }

    .names{
      font-weight: 1000;
      font-size: 16px;
      color: rgba(229,231,235,.95);
      text-align:right;
      flex: 1 1 auto;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .names.dark{ color:#111827; }

    .scoreRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.10);
    }
    .scoreLabel{
      color: var(--muted);
      font-weight: 900;
      font-size: 13px;
    }
    .scoreValue{
      font-weight: 1000;
      font-size: 22px;
      letter-spacing:.5px;
      white-space:nowrap;
    }

    .benchBox{
      margin-top: 12px;
      padding: 10px;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      overflow:hidden;
    }
    .benchTitle{
      font-weight:1000;
      font-size: 14px;
      margin-bottom: 8px;
      color: rgba(229,231,235,.92);
      white-space:nowrap;
    }
    .benchList{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-weight: 1000;
      font-size: 14px;
      color: rgba(229,231,235,.92);
      white-space:nowrap;
    }

    /* Rankings */
    .duelRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      margin-top: 10px;
    }
    .bigPts{
      font-weight:1000;
      font-size: 28px;
      letter-spacing:.5px;
      white-space:nowrap;
    }

    table{
      width: 100%;
      border-collapse: collapse;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      font-size: 13px; /* un poil plus petit pour tenir sans scroll */
    }
    th, td{
      padding: 8px 10px;       /* ✅ plus compact */
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align:left;
      vertical-align: top;
      font-weight: 900;
      white-space:nowrap;
    }
    th{
      background: rgba(255,255,255,.06);
      color: rgba(229,231,235,.92);
      font-weight: 1000;
      font-size: 12px;
      letter-spacing:.2px;
    }
    td b{ font-weight: 1000; }
    .right{ text-align:right; }
    td.nameCell{
      max-width: 0;
      overflow:hidden;
      text-overflow:ellipsis;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topBars">
      <!-- Bandeau vert (Admin) -->
      <div class="barAdmin">
        <div class="adminRow">
          <div>
            <img src="img/logo-suzini.jpeg" alt="TC Suzini" class="brandImg">
          </div>
          <div class="adminCenter">
            <div class="t1">Americano Lisa vs Manon</div>
            <div class="t2">BT Suzini</div>
          </div>
          <div class="rightPack">
            <img src="img/tournoi.jpeg" alt="Tournoi" class="brandImg">
            <span class="statusDotOnly" id="statusDot" aria-label="statut connexion"></span>
          </div>
        </div>
      </div>

      <!-- Bandeau rouge Lisa -->
      <div class="barLisa">🌶️🌶️🌶️ Team LISA « LOS PIMIENTOOOOOOS » 🌶️🌶️🌶️</div>

      <!-- Bandeau jaune Manon -->
      <div class="barManon">🐝🐝🐝 Team Manon « HONEY SMASH » 🐝🐝🐝</div>
    </div>

    <main>
      <div class="wrap">
        <div class="grid">
          <!-- ===================== GAUCHE (2/3) ===================== -->
          <div class="col left">
            <div class="card">
              <div class="cardHead">
                <div class="cardTitle">Tour en cours</div>
                <div class="cardMeta" id="curMeta">—</div>
              </div>
              <div id="curBody" class="cardBody">
                <div class="miniInfo">Chargement…</div>
              </div>
            </div>

            <div class="card">
              <div class="cardHead">
                <div class="cardTitle">Tour à venir</div>
                <div class="cardMeta" id="nextMeta">—</div>
              </div>
              <div id="nextBody" class="cardBody">
                <div class="miniInfo">Chargement…</div>
              </div>
            </div>
          </div>

          <!-- ===================== DROITE (1/3) ===================== -->
          <div class="col right">
            <div class="card">
              <div class="cardHead">
                <div class="cardTitle">Classement par équipe</div>
                <div class="cardMeta">Somme pointsGeneral</div>
              </div>
              <div id="teamRankBox" class="cardBody">
                <div class="miniInfo">Chargement…</div>
              </div>
            </div>

            <div class="card">
              <div class="cardHead">
                <div class="cardTitle">Classement individuel (général)</div>
                <div class="cardMeta">Top (TV)</div>
              </div>
              <div id="indRankBox" class="cardBody">
                <div class="miniInfo">Chargement…</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

<script type="module">
  // ================================
  // Firebase
  // ================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7-WLKEmajFSh4INdTCVpPvF2hv_jPQm8",
    authDomain: "americano-lisa-manon.firebaseapp.com",
    projectId: "americano-lisa-manon",
    storageBucket: "americano-lisa-manon.firebasestorage.app",
    messagingSenderId: "98885291802",
    appId: "1:98885291802:web:6aff774b8f8df14db226a3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ================================
  // State
  // ================================
  const playersCol = collection(db, "players");
  const matchesCol = collection(db, "matches");

  let playersCache = [];
  let matchesCache = [];

  // ================================
  // UI
  // ================================
  const statusDot = document.getElementById("statusDot");
  function setStatus(state){
    statusDot.classList.remove("ok","bad");
    if(state==="ok") statusDot.classList.add("ok");
    else if(state==="bad") statusDot.classList.add("bad");
  }

  const curMeta  = document.getElementById("curMeta");
  const nextMeta = document.getElementById("nextMeta");

  const curBody  = document.getElementById("curBody");
  const nextBody = document.getElementById("nextBody");

  const teamRankBox = document.getElementById("teamRankBox");
  const indRankBox  = document.getElementById("indRankBox");

  // ================================
  // Helpers
  // ================================
  function groupMatchesByRound(list){
    const map = new Map();
    list.forEach(m=>{
      const r = Number(m.roundNumber || 0);
      if(!r) return;
      if(!map.has(r)) map.set(r, []);
      map.get(r).push(m);
    });
    return [...map.entries()].map(([round, matches])=>{
      const mm = [...matches].sort((a,b)=>(a.court||0)-(b.court||0));
      return { round, matches: mm };
    }).sort((a,b)=>a.round-b.round);
  }

  function isRoundFullyValidated(roundObj){
    if(!roundObj || !roundObj.matches?.length) return false;
    if(roundObj.matches.length < 2) return false;
    return roundObj.matches.slice(0,2).every(m => m.validated === true);
  }

  function buildBenchForRound(roundObj){
    const playing = new Set();
    (roundObj.matches || []).slice(0,2).forEach(m=>{
      (m.teamA||[]).forEach(n=>playing.add(n));
      (m.teamB||[]).forEach(n=>playing.add(n));
    });

    const allNames = playersCache.map(p=>p.name).filter(Boolean);
    const bench = allNames.filter(n=>!playing.has(n));
    return bench.sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));
  }

  function scoreText(m){
    const a = (typeof m.scoreA==="number") ? m.scoreA : null;
    const b = (typeof m.scoreB==="number") ? m.scoreB : null;
    if(a===null || b===null) return "—";
    return `${a} - ${b}`;
  }

  function renderRoundCardTV(roundObj, mode){
    // mode: "current" | "next"
    if(!roundObj){
      return `<div class="miniInfo">Aucun tour.</div>`;
    }

    const r = roundObj.round;
    const matches = (roundObj.matches||[]).slice(0,2);
    if(matches.length < 2){
      return `<div class="miniInfo">Tour ${r} incomplet (2 terrains requis).</div>`;
    }

    const typeLabel = (matches[0].type || matches[1].type || "—");
    const bench = buildBenchForRound(roundObj);

    let html = `<div class="miniInfo"><b>Tour ${r}</b> • Type: <b>${typeLabel}</b></div>`;
    html += `<div class="courtsGrid">`;

    matches.forEach((m, idx)=>{
      const court = m.court || (idx+1);
      const A = (m.teamA||[]);
      const B = (m.teamB||[]);
      const validated = (m.validated===true);
      const sc = (mode==="next") ? "—" : scoreText(m);

      html += `
        <div class="courtBlock">
          <div class="courtTop">
            <div class="courtName">Terrain ${court}</div>
            <div class="courtState">${validated ? "✅ Validé" : (mode==="next" ? "🕒 À venir" : "⏳ En cours")}</div>
          </div>

          <div class="teamLine">
            <span class="badge lisa">🌶️ Lisa</span>
            <div class="names">${(A[0]||"—")} • ${(A[1]||"—")}</div>
          </div>

          <div class="teamLine" style="background: rgba(250,204,21,.14); border-color: rgba(0,0,0,.10);">
            <span class="badge manon">🐝 Manon</span>
            <div class="names dark">${(B[0]||"—")} • ${(B[1]||"—")}</div>
          </div>

          <div class="scoreRow">
            <div class="scoreLabel">Score</div>
            <div class="scoreValue">${sc}</div>
          </div>
        </div>
      `;
    });

    html += `</div>`;

    html += `
      <div class="benchBox">
        <div class="benchTitle">Banc</div>
        <div class="benchList">
          ${bench.length ? bench.map(n=>`<span class="pill">${n}</span>`).join("") : `<span class="miniInfo">Personne</span>`}
        </div>
      </div>
    `;

    return html;
  }

  function renderTours(){
    const rounds = groupMatchesByRound(matchesCache);

    const lastValid = [...rounds].reverse().find(r=>isRoundFullyValidated(r)) || null;
    const current  = rounds.find(r=>!isRoundFullyValidated(r)) || null;

    let next = null;
    if(current){
      next = rounds.find(r=>r.round === current.round + 1) || null;
    } else if(lastValid){
      next = rounds.find(r=>r.round === lastValid.round + 1) || null;
    }

    curMeta.textContent  = current ? `Tour ${current.round}` : "—";
    nextMeta.textContent = next    ? `Tour ${next.round}`    : "—";

    curBody.innerHTML  = current ? renderRoundCardTV(current, "current") : `<div class="miniInfo">Aucun tour en cours.</div>`;
    nextBody.innerHTML = next ? renderRoundCardTV(next, "next") : `<div class="miniInfo">Aucun tour à venir.</div>`;
  }

  function renderRankings(){
    if(!playersCache.length){
      teamRankBox.innerHTML = `<div class="miniInfo">Aucun joueur.</div>`;
      indRankBox.innerHTML  = `<div class="miniInfo">Aucun joueur.</div>`;
      return;
    }

    const sorted = [...playersCache]
      .filter(p=>p.name)
      .sort((a,b)=>(Number(b.pointsGeneral)||0) - (Number(a.pointsGeneral)||0));

    const sumLisa  = sorted.filter(p=>p.team==="Lisa").reduce((s,p)=> s + (Number(p.pointsGeneral)||0), 0);
    const sumManon = sorted.filter(p=>p.team==="Manon").reduce((s,p)=> s + (Number(p.pointsGeneral)||0), 0);

    teamRankBox.innerHTML = `
      <div class="duelRow">
        <span class="badge lisa">🌶️ Team Lisa</span>
        <span class="bigPts">${sumLisa}</span>
      </div>
      <div class="duelRow" style="border-color: rgba(0,0,0,.10); background: rgba(250,204,21,.18); color:#111827;">
        <span class="badge manon">🐝 Team Manon</span>
        <span class="bigPts">${sumManon}</span>
      </div>
    `;

    /* ✅ Important pour "no scroll" : on limite le TOP */
    const TOP_N = 14; // ajuste si besoin (12/14/16) selon ta TV
    const top = sorted.slice(0, TOP_N);

    let html = `<table>
      <thead>
        <tr>
          <th style="width:54px;">#</th>
          <th>Joueur</th>
          <th style="width:110px;">Team</th>
          <th class="right" style="width:96px;">Pts</th>
        </tr>
      </thead>
      <tbody>`;

    top.forEach((p, idx)=>{
      const teamTxt = p.team==="Lisa" ? "🌶️ Lisa" : (p.team==="Manon" ? "🐝 Manon" : "—");
      html += `<tr>
        <td>${idx+1}</td>
        <td class="nameCell"><b>${p.name||""}</b></td>
        <td>${teamTxt}</td>
        <td class="right"><b>${Number(p.pointsGeneral)||0}</b></td>
      </tr>`;
    });
    html += `</tbody></table>`;

    indRankBox.innerHTML = html;
  }

  // ================================
  // Live listeners
  // ================================
  function init(){
    setStatus("warn");

    onSnapshot(query(playersCol, orderBy("createdAt","asc")), (snap)=>{
      playersCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      renderRankings();
      renderTours(); // recalcul banc
      setStatus("ok");
    }, (err)=>{
      console.error(err);
      setStatus("bad");
    });

    onSnapshot(query(matchesCol, orderBy("createdAt","asc")), (snap)=>{
      matchesCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      renderTours();
      setStatus("ok");
    }, (err)=>{
      console.error(err);
      setStatus("bad");
    });
  }

  init();
</script>
</body>
</html>
